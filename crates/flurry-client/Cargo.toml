[package]
name = "flurry-client"
description = "Flurry PC client — 3DS screen streaming viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "6.0.0"
# glow (OpenGL) renderer: the default wgpu backend produced two validation
# panics in normal use (texture create_view; index staging buffer).
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.35.0"
flurry-proto = { path = "../flurry-proto" }
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zune-jpeg = "0.5.15"
